[package]
name = "audio2text"
version = "0.1.3"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Audio capture
cpal = "0.15"


# Native Wayland virtual keyboard; wl-copy remains a manual fallback.
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
tempfile = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# Ringbuffer for audio
ringbuf = "0.4"


# HTTP types for WebSocket
http = "1"
url = "2"
rubato = "0.16"
hound = "3.5"
openssl = "0.10"
opus = "0.3"
snap = "1"
